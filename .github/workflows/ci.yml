name: CI Build and Test

on:
  push:
    branches:
      - develop
      - master
      - main
  pull_request:
    branches:
      - develop
      - master
      - main

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make CI script executable
        if: runner.os != 'Windows'
        run: chmod +x ci.sh

      - name: Build and test on Linux and macOS
        if: runner.os != 'Windows'
        run: ./ci.sh

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: ci.bat
